name: Close linked issue on public-dev merge

on:
  pull_request:
    types: [closed]
    branches:
      - public-dev

jobs:
  close-linked-issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const matches = [...body.matchAll(/(?:fixes|closes|resolves)\s+#(\d+)/gi)];
            const issueNumbers = [...new Set(matches.map(m => parseInt(m[1], 10)))];

            if (issueNumbers.length === 0) {
              console.log('No linked issue found in PR body.');
              return;
            }

            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'completed'
                });
                console.log(`Closed issue #${issueNumber}`);
              } catch (error) {
                console.error(`Failed to close issue #${issueNumber}: ${error.message}`);
              }
            }

      - name: Delete source branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const headRef = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${headRef}`
              });
              console.log(`Deleted branch ${headRef}`);
            } catch (error) {
              console.error(`Failed to delete branch ${headRef}: ${error.message}`);
            }
